services:
  - type: web
    name: tictacarenaweb
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "false"
      - key: SITE_URL
        value: https://tictacarena.in
      - key: CORS_ORIGINS
        value: https://tictacarena.in,https://www.tictacarena.in,https://tictacarenaweb.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: tta_session
      - key: SESSION_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_PUBLIC_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TOPUP_SANDBOX
        value: "false"
      - key: TOPUP_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_BYTES
        value: "5242880"
